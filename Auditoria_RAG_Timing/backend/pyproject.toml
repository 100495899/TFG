[project]
name = "rag-timing-audit-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29.0",
  "alembic>=1.13.2",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "arq>=0.26.1",
  "redis>=5.0.8",
  "bcrypt>=4.2.0",
  "PyJWT>=2.9.0",
  "email-validator>=2.2.0",
  "numpy>=2.0.0",
  "scipy>=1.14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.23.8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
