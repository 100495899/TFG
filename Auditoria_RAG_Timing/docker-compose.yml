services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DATASETS_DIR: ${DATASETS_DIR}
      MAX_DATASET_SIZE_MB: ${MAX_DATASET_SIZE_MB}
      MAX_QUERIES_PER_AUDIT: ${MAX_QUERIES_PER_AUDIT}
      MAX_CONCURRENT_AUDITS: ${MAX_CONCURRENT_AUDITS}
      BACKEND_CORS_ORIGIN: ${BACKEND_CORS_ORIGIN}
      API_V1_PREFIX: ${API_V1_PREFIX}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - datasets_data:/data/datasets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DATASETS_DIR: ${DATASETS_DIR}
      MAX_DATASET_SIZE_MB: ${MAX_DATASET_SIZE_MB}
      MAX_QUERIES_PER_AUDIT: ${MAX_QUERIES_PER_AUDIT}
      MAX_CONCURRENT_AUDITS: ${MAX_CONCURRENT_AUDITS}
      BACKEND_CORS_ORIGIN: ${BACKEND_CORS_ORIGIN}
      API_V1_PREFIX: ${API_V1_PREFIX}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    command: arq app.workers.arq_worker.WorkerSettings
    volumes:
      - ./backend:/app
      - datasets_data:/data/datasets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  mock-rag:
    build: ./mock-rag
    ports:
      - "8010:8010"

volumes:
  postgres_data:
  datasets_data:
